<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ahmad - Digital Business Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            accent: '#0284c7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.2 },
                            '50%': { opacity: 0.5 },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Clean Light Glassmorphism / Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .glass-button {
            background: rgba(241, 245, 249, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(2, 132, 199, 0.1);
            border-color: rgba(2, 132, 199, 0.3);
            transform: translateY(-2px);
        }

        /* Custom Toast Fade Animation */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #toast.hidden-toast {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        #toast.show-toast {
            opacity: 1;
            transform: translateY(0);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-border {
            position: relative;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(2,132,199,0.2) 0%, rgba(0,0,0,0.05) 100%);
            padding: 1px;
        }

        /* Expandable Plans Drawer */
        .plans-panel {
            display: none;
        }
        .plans-panel.open {
            display: block;
        }
        .service-chevron {
            transition: transform 0.25s ease;
        }
        .service-item.open .service-chevron {
            transform: rotate(90deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Ambient Glowing Background Elements -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-sky-200 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-blue-100 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 2s;"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md z-10">

        <!-- Business Card Wrapper -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden transition-all duration-500">
            
            <!-- Top Action Buttons (QR Code & Share) -->
            <div class="flex justify-between items-center mb-6">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-sky-100 text-sky-700 border border-sky-200">
                    <span class="w-2 h-2 rounded-full bg-sky-500 animate-ping"></span>
                    Available for Consultations
                </span>
                <div class="flex items-center gap-2">
                    <button onclick="openQRModal()" title="Show QR Code" class="glass-button w-9 h-9 rounded-full flex items-center justify-center text-gray-700 hover:text-sky-600">
                        <i class="fa-solid fa-qrcode text-sm"></i>
                    </button>
                    <button onclick="shareCard()" title="Share Business Card" class="glass-button w-9 h-9 rounded-full flex items-center justify-center text-gray-700 hover:text-sky-600">
                        <i class="fa-solid fa-share-nodes text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Profile Header -->
            <div class="text-center mb-8">
                <!-- Avatar Icon / Monogram -->
                <div class="relative w-24 h-24 mx-auto mb-4">
                    <div class="w-full h-full rounded-2xl bg-gradient-to-tr from-sky-600 to-blue-500 p-0.5 shadow-lg shadow-sky-500/20">
                        <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                            <span class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-sky-600 to-blue-600">MA</span>
                        </div>
                    </div>
                    <div class="absolute -bottom-1 -right-1 bg-sky-600 text-white p-1.5 rounded-lg text-xs shadow-md" title="Verified Specialist">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <!-- Name & Role -->
                <h1 class="text-2xl sm:text-3xl font-bold gradient-text tracking-tight mb-1">
                    Muhammad Ahmad
                </h1>
                <p class="text-sky-600 font-medium text-sm sm:text-base mb-2">
                    Telecommunications &amp; Tech Sales Specialist
                </p>
                
                <!-- Location Tag -->
                <div class="inline-flex items-center gap-1.5 text-xs text-gray-600 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
                    <i class="fa-solid fa-location-dot text-sky-600"></i>
                    <span>Ontario, Canada</span>
                </div>
            </div>

            <!-- Quick Action Grid -->
            <div class="grid grid-cols-4 gap-2 mb-8">
                <!-- Call -->
                <a href="tel:6479335375" class="glass-button rounded-2xl p-3 flex flex-col items-center justify-center text-center group">
                    <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-1.5 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-phone text-base"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-800">Call</span>
                </a>

                <!-- WhatsApp -->
                <a href="https://wa.me/16479335375?text=Hi%20Muhammad,%20I'd%20like%20to%20inquire%20about%20your%20services." target="_blank" rel="noopener noreferrer" class="glass-button rounded-2xl p-3 flex flex-col items-center justify-center text-center group">
                    <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center mb-1.5 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                    </div>
